# .github/workflows/monthly-refresh.yml
#
# Runs on the 12th of each month at 06:00 UTC. Statistics Denmark actually
# publishes each month's VAN77M data ~5.5-6 weeks after month-end (not the
# ~3 weeks originally assumed here) — e.g. July 2026 data landed 2026-09-07.
# The 5th consistently fired before that month's release existed, silently
# posting a Slack update still one month stale; the 12th gives enough
# buffer to catch it most months. fetch_data.py self-corrects to whatever
# is actually published either way, so an early run is harmless — worst
# case it just re-fetches the same latest month again.
#
# Fetches fresh data, posts juicy deets to Slack, commits updated CSVs.
# To test manually: Actions → "Monthly data refresh" → Run workflow.

name: Monthly data refresh

on:
  schedule:
    - cron: '0 6 12 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest data
        run: python fetch_data.py

      - name: Post to Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python monthly_report.py

      - name: Commit and push updated CSVs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/van66_raw.csv data/van77m_raw.csv
          git diff --staged --quiet \
            || git commit -m "chore: monthly data refresh $(date +'%Y-%m-%d')"
          git push
